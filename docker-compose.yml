services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:${HERMES_DASHBOARD_PORT:-9119}"
      - "127.0.0.1:${HERMES_API_PORT:-8642}:${HERMES_API_PORT:-8642}"
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "${HERMES_DASHBOARD_PORT:-9119}"
      HERMES_DASHBOARD_INSECURE: "1"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${API_SERVER_KEY}"
      API_SERVER_CORS_ORIGINS: "*"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./hermes_data:/opt/data
      - ./logs:/var/log/hermes
    networks:
      - hermes_net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: hermes-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    env_file:
      - .env
    environment:
      WEBUI_NAME: "${OPEN_WEBUI_NAME:-Hermes Open WebUI}"
      WEBUI_SECRET_KEY: "${OPEN_WEBUI_SECRET_KEY}"
      WEBUI_URL: "${OPEN_WEBUI_PUBLIC_URL:-}"
      WEBUI_ADMIN_EMAIL: "${OPEN_WEBUI_ADMIN_EMAIL:-admin@hermes.local}"
      WEBUI_ADMIN_PASSWORD: "${OPEN_WEBUI_ADMIN_PASSWORD}"
      ENABLE_SIGNUP: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: "http://hermes-agent:${HERMES_API_PORT:-8642}/v1"
      OPENAI_API_KEY: "${API_SERVER_KEY}"
      DEFAULT_MODELS: "hermes-agent"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - hermes-agent
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - hermes_net

  ngrok-hermes:
    image: ngrok/ngrok:latest
    container_name: hermes-ngrok
    restart: unless-stopped
    command:
      - http
      - open-webui:8080
      - --log=stdout
      - --region=eu
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - open-webui
    networks:
      - hermes_net

volumes:
  open-webui-data:

networks:
  hermes_net:
    driver: bridge
    name: ${DOCKER_NETWORK:-hermes_net}
