services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:${HERMES_DASHBOARD_PORT:-9119}"
      - "127.0.0.1:${HERMES_API_PORT:-8642}:${HERMES_API_PORT:-8642}"
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "${HERMES_DASHBOARD_PORT:-9119}"
      HERMES_DASHBOARD_INSECURE: "1"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${API_SERVER_KEY}"
      API_SERVER_CORS_ORIGINS: "*"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./hermes_data:/opt/data
      - ./logs:/var/log/hermes
    networks:
      - hermes_net

  hermes-dashboard-gui:
    image: nginx:1.27-alpine
    container_name: hermes-dashboard-gui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_GUI_PORT:-8088}:${DASHBOARD_GUI_PORT:-8088}"
    env_file:
      - .env
    environment:
      DASHBOARD_GUI_PORT: "${DASHBOARD_GUI_PORT:-8088}"
      HERMES_DASHBOARD_URL: "http://hermes-agent:${HERMES_DASHBOARD_PORT:-9119}"
      HERMES_API_URL: "http://hermes-agent:${HERMES_API_PORT:-8642}"
      API_SERVER_KEY: "${API_SERVER_KEY}"
    volumes:
      - ./dashboard-gui:/usr/share/nginx/html:ro
      - ./dashboard-gui/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - hermes-agent
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/healthz >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - hermes_net

  ngrok-hermes:
    image: ngrok/ngrok:latest
    container_name: hermes-ngrok
    restart: unless-stopped
    command:
      - http
      - hermes-dashboard-gui:${DASHBOARD_GUI_PORT:-8088}
      - --log=stdout
      - --region=eu
      - --basic-auth=${NGROK_AUTH_USER:-hermes}:${NGROK_AUTH_PASS}
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - hermes-dashboard-gui
    networks:
      - hermes_net

networks:
  hermes_net:
    driver: bridge
    name: ${DOCKER_NETWORK:-hermes_net}
