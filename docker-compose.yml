services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:${HERMES_DASHBOARD_PORT:-9119}"
      - "127.0.0.1:${HERMES_API_PORT:-8642}:${HERMES_API_PORT:-8642}"
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "${HERMES_DASHBOARD_PORT:-9119}"
      HERMES_DASHBOARD_INSECURE: "1"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${API_SERVER_KEY}"
      API_SERVER_CORS_ORIGINS: "*"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./hermes_data:/opt/data
      - ./logs:/var/log/hermes
    networks:
      - hermes_net

  ngrok-hermes:
    image: ngrok/ngrok:latest
    container_name: hermes-ngrok
    restart: unless-stopped
    command:
      - http
      - hermes-agent:${HERMES_DASHBOARD_PORT:-9119}
      - --log=stdout
      - --region=eu
      - --basic-auth=${NGROK_AUTH_USER:-hermes}:${NGROK_AUTH_PASS}
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - hermes-agent
    networks:
      - hermes_net

networks:
  hermes_net:
    driver: bridge
    name: ${DOCKER_NETWORK:-hermes_net}
